<input id="url" placeholder="Colle ton lien https://...">
<input id="promo" placeholder="Code promo ex: PROMO10">
<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0"><input type="checkbox" id="withLogo" checked style="width:auto"> Avec logo au centre</label>
<button onclick="gen()">Générer QR</button>
<div id="qrWrap">
<canvas id="c" width="600" height="600"></canvas>
<div id="linkOut" class="small"></div>
<div id="badgeOut"></div>
<button onclick="downloadMain()" style="background:#1a2e2a;color:#4de8d4;border:1px solid #2a4a45;margin-top:10px">Télécharger PNG</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const logoImg=document.getElementById('logoSrc');
function buildUrl(base,promo){
 if(!promo) return base;
 return base+(base.includes('?')?'&':'?')+'promo='+encodeURIComponent(promo);
}
function gen(){
 let u=document.getElementById('url').value.trim();
 let p=document.getElementById('promo').value.trim();
 if(!u){alert('Colle un lien');return;}
 let finalUrl=buildUrl(u,p);
 let withLogo=document.getElementById('withLogo').checked;
 let qr=qrcode(0,'H');
 qr.addData(finalUrl);
 qr.make();
 let canvas=document.getElementById('c');
 let ctx=canvas.getContext('2d');
 let S=600,margin=40,n=qr.getModuleCount();
 let cell=(S-2*margin)/n;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
 ctx.fillStyle='#000';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){
   if(qr.isDark(r,c)) ctx.fillRect(Math.floor(margin+c*cell),Math.floor(margin+r*cell),Math.ceil(cell),Math.ceil(cell));
 }
 if(withLogo){
   let logoSize=S*0.2;
   let bgSize=logoSize+24;
   let x=(S-bgSize)/2,y=(S-bgSize)/2;
   ctx.fillStyle='#fff';
   ctx.beginPath();
   if(ctx.roundRect){ctx.roundRect(x,y,bgSize,bgSize,18);}else{ctx.rect(x,y,bgSize,bgSize);}
   ctx.fill();
   ctx.drawImage(logoImg,x+(bgSize-logoSize)/2,y+(bgSize-logoSize)/2,logoSize,logoSize);
 }
 document.getElementById('qrWrap').style.display='block';
 document.getElementById('linkOut').textContent=finalUrl;
 document.getElementById('badgeOut').innerHTML=p?'<span class=badge></span>':'';
 if(p) document.querySelector('#badgeOut .badge').textContent=p;
}
function downloadMain(){
 let canvas=document.getElementById('c');
 let a=document.createElement('a');
 a.download='QR-'+Date.now()+'.png';
 a.href=canvas.toDataURL();
 a.click();
}
</script>
